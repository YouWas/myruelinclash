# Mihomo / Clash Verge Rev 完整設定結構（尚需填入有效節點訂閱）
# 公開版本只有佔位網址，不含私人訂閱或節點憑證。
# 請在本機副本或客戶端覆寫中替換 proxy-providers.subscription.url。
# 遠端 YAML 更新會覆蓋直接編輯的副本；長期使用請配置客戶端持久覆寫。
# 原 JS 只提供分組／規則；以下基礎項目是新增的保守預設。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
profile:
  store-selected: true

# 使用系統 DNS；TUN 和系統代理由客戶端操作。
dns:
  enable: false
tun:
  enable: false

proxies: []
proxy-providers:
  subscription:
    type: http
    url: "https://example.invalid/REPLACE_WITH_YOUR_SUBSCRIPTION_URL"
    path: ./proxy_providers/personal-subscription.yaml
    interval: 3600
    health-check:
      enable: true
      url: "https://www.google.com/generate_204"
      interval: 300
      timeout: 3000
      lazy: true

proxy-groups:
  - name: "💬ChatGPT"
    type: select
    use:
      - subscription
    hidden: false
  - name: "Google"
    type: select
    proxies:
      - DIRECT
      - "💬ChatGPT"
    use:
      - subscription
    hidden: false
  - name: "muti_media"
    type: select
    proxies:
      - DIRECT
    use:
      - subscription
    hidden: false

# 由原 JS 轉換：移除誤用的 IN-USER、去重，將 Music 精確域名提前。
# Google / muti_media 預設直連，使用時請按需求切換節點。
