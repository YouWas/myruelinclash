[custom]
; GitHub public template: no subscription URLs or node credentials.
; All unmatched traffic goes DIRECT. Use Clash rule mode.
enable_rule_generator=true
overwrite_original_rules=true

custom_proxy_group=💬ChatGPT`select`.*
custom_proxy_group=Google`select`[]DIRECT`[]💬ChatGPT`.*
custom_proxy_group=muti_media`select`[]DIRECT`.*

